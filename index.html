<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0E0E12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Alter Isle Mini — AlterU</title>
    <link rel="icon" type="image/svg+xml" href="img/aigram.svg" />
    <link rel="stylesheet" href="styles.css?v=8" />
</head>
<body>
    <div id="loading-screen">
        <!-- Decorative floating shapes (purely visual) -->
        <div class="ls-bg" aria-hidden="true">
            <span class="ls-blob ls-blob-1"></span>
            <span class="ls-blob ls-blob-2"></span>
            <span class="ls-blob ls-blob-3"></span>
            <span class="ls-dot ls-dot-1"></span>
            <span class="ls-dot ls-dot-2"></span>
            <span class="ls-dot ls-dot-3"></span>
            <span class="ls-dot ls-dot-4"></span>
        </div>

        <div class="loading-card">
            <!-- Top: AlterU brand mark (uses canonical /img/aigram.svg) -->
            <div class="ls-brand" aria-label="AlterU">
                <span class="ls-brand-mark"></span>
            </div>

            <!-- Centerpiece: 2×2 isometric tile stage that pulses with
                 the AlterU palette while the game pack pre-renders. -->
            <div class="ls-stage" aria-hidden="true">
                <span class="ls-tile ls-tile-1"></span>
                <span class="ls-tile ls-tile-2"></span>
                <span class="ls-tile ls-tile-3"></span>
                <span class="ls-tile ls-tile-4"></span>
            </div>

            <h1 class="loading-title">Alter Isle <span class="ls-mini-tag">MINI</span></h1>
            <p class="loading-sub">A sandbox for your alter self</p>

            <div class="loading-bar"><div class="loading-fill" id="loading-fill"></div></div>
            <div class="loading-status" id="loading-status">warming the kilns</div>
        </div>
    </div>

    <div id="app" class="hidden">
        <canvas id="game-canvas"></canvas>

        <!-- Top-left: tiny "•••" settings button -->
        <button id="settings-btn" type="button" aria-label="Settings">
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </button>

        <!-- Settings popover (collapsed by default) -->
        <div id="settings-pop" class="hidden" role="menu">
            <button type="button" data-action="grid"    role="menuitemcheckbox">Grid</button>
            <button type="button" data-action="shadows" role="menuitemcheckbox">Shadows</button>
            <button type="button" data-action="fill"    role="menuitem">Fill with grass</button>
            <button type="button" data-action="reset"   role="menuitem" class="danger">Reset island</button>
        </div>

        <!-- Top toolbar: build/pan/erase mode segmented + rotate action -->
        <div id="toolbar-top" role="toolbar" aria-label="Tools">
            <div id="tool-modes" role="group">
                <button type="button" class="tool-mode" data-mode="place" aria-pressed="true" aria-label="Build">
                    <!-- Plus sign: add / place. Universally read as "new". -->
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 4 V20 M4 12 H20"
                              fill="none" stroke="currentColor"
                              stroke-width="3.2" stroke-linecap="round"/>
                    </svg>
                </button>
                <button type="button" class="tool-mode" data-mode="pan" aria-pressed="false" aria-label="Pan">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 4 V20 M4 12 H20 M9 7 L12 4 L15 7 M9 17 L12 20 L15 17 M7 9 L4 12 L7 15 M17 9 L20 12 L17 15"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <button type="button" class="tool-mode" data-mode="erase" aria-pressed="false" aria-label="Erase">
                    <!-- Tilted eraser, outlined to match the +/pan icons:
                         no fills, currentColor stroke, two dust ticks
                         below to read as "erasing motion". -->
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <g transform="rotate(-32 12 12)">
                            <rect x="3" y="9" width="18" height="6" rx="1.6"
                                  fill="none" stroke="currentColor" stroke-width="2"
                                  stroke-linejoin="round"/>
                            <line x1="10.5" y1="9" x2="10.5" y2="15"
                                  stroke="currentColor" stroke-width="1.8"/>
                        </g>
                        <path d="M5 19.5 L7 20.2 M9 20.4 L11 20.9"
                              stroke="currentColor" stroke-width="1.6"
                              stroke-linecap="round" fill="none"/>
                    </svg>
                </button>
            </div>
            <!-- Random-generate action: re-rolls the island in one tap. -->
            <button type="button" id="tool-shuffle" class="tool-action" aria-label="Shuffle island">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="4" y="4" width="16" height="16" rx="3.5" fill="none" stroke="currentColor" stroke-width="2"/>
                    <circle cx="8.5"  cy="8.5"  r="1.6" fill="currentColor"/>
                    <circle cx="15.5" cy="15.5" r="1.6" fill="currentColor"/>
                    <circle cx="15.5" cy="8.5"  r="1.6" fill="currentColor"/>
                    <circle cx="8.5"  cy="15.5" r="1.6" fill="currentColor"/>
                    <circle cx="12"   cy="12"   r="1.6" fill="currentColor"/>
                </svg>
            </button>
        </div>

        <!-- First-run hint card -->
        <div id="hint-card" class="hidden" aria-hidden="true">
            <div class="hint-card-inner">
                <h3>Build your isle</h3>
                <ul class="hint-list">
                    <li><b>Tap</b> a tile to place the selected piece</li>
                    <li><b>Drag</b> to brush across cells</li>
                    <li><b>Pan / Erase</b> tools at the top change the mode</li>
                    <li><b>Two-finger drag</b> moves the camera anytime</li>
                    <li><b>Pinch</b> to zoom</li>
                </ul>
                <button type="button" id="hint-dismiss">Got it</button>
            </div>
        </div>

        <!-- Bottom dock: 3 category tabs + horizontal swatch scroller -->
        <section id="dock">
            <nav id="dock-tabs"></nav>
            <div id="dock-swatches"></div>
        </section>

        <a id="watermark" href="https://alteru.app" target="_blank" rel="noopener" aria-label="AlterU"></a>

        <div id="toast"></div>
    </div>

    <script type="module" src="src/main.js?v=8"></script>
</body>
</html>
